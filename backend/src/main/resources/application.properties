spring.application.name=medication-safety-api

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/medication_safety}
spring.datasource.username=${DB_USERNAME:medication_app}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080

# Health monitoring
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

spring.jpa.open-in-view=false

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

ai.service.base-url=http://localhost:8000
